[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React/Vite client-side routes.
# public/_redirects provides the same fallback in the generated dist folder.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
